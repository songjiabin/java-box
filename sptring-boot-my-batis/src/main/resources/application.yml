spring:
  datasource:
    username: root
    password: wssjb
    #?serverTimezone=UTC 解决时区的报错
    url: jdbc:mysql://localhost:3306/mybatis?serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8
    driver-class-name: com.mysql.cj.jdbc.Driver

# MyBatis 配置，用于指定实体类别名扫描范围和 Mapper XML 文件位置。
mybatis:
  # 扫描实体类所在的包，为实体类注册类别名，XML 中可以直接使用类名而不用写完整包名。
  type-aliases-package: com.demo.spring.boot.my.batis.bean
  # 指定 Mapper XML 文件的位置；classpath 表示从 resources 目录开始查找。
  mapper-locations: classpath:mybatis/mapper/*.xml
