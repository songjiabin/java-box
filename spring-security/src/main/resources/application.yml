# Spring Boot 服务监听端口，浏览器通过该端口访问页面和接口。
server:
  port: 8080

spring:
  datasource:
    username: root
    password: wssjb
    #?serverTimezone=UTC 解决时区的报错
    url: jdbc:mysql://localhost:3306/mytest?serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8
    driver-class-name: com.mysql.cj.jdbc.Driver


# MyBatis 配置，用于指定实体类别名扫描范围和 Mapper XML 文件位置。
mybatis:
  # 扫描实体类所在的包，为实体类注册类别名，XML 中可以直接使用类名而不用写完整包名。
  type-aliases-package: com.demo.spring.security.dao
  # 指定 Mapper XML 文件的位置；classpath 表示从 resources 目录开始查找。
  mapper-locations: classpath:mybatis/mapper/*.xml
  # 开启下划线转驼峰配置
  configuration:
    map-underscore-to-camel-case: true