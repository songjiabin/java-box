<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 2 · 操作日志</title>
    <style>
        /* Level 2 页面使用蓝色强调色，表达登录用户可访问的业务区域。 */
        :root { --bg: #f4f7fb; --panel: #fff; --text: #172033; --muted: #68748a; --line: #dbe3ef; --accent: #2563a8; --soft: #e8f1fb; }
        * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
        .shell { width: min(1120px, calc(100% - 40px)); margin: auto; padding: 28px 0 48px; } header { display: flex; justify-content: space-between; margin-bottom: 28px; } .brand { font-weight: 800; text-decoration: none; letter-spacing: .02em; } .back { color: var(--muted); text-decoration: none; font-size: 14px; }
        .panel { padding: 32px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; } .eyebrow { margin: 0 0 10px; color: var(--accent); font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; } h1 { margin: 0 0 10px; font-size: 36px; } .lead { margin: 0 0 24px; color: var(--muted); line-height: 1.7; }
        .log { display: grid; gap: 0; border-top: 1px solid var(--line); } .entry { display: grid; grid-template-columns: 150px 1fr auto; gap: 18px; align-items: center; padding: 18px 0; border-bottom: 1px solid var(--line); } time, .status { color: var(--muted); font-size: 14px; } .entry strong { font-size: 15px; } .status { padding: 5px 9px; border-radius: 5px; background: var(--soft); color: var(--accent); }
        @media (max-width: 650px) { .shell { width: min(100% - 28px, 560px); } .panel { padding: 26px; } .entry { grid-template-columns: 1fr; gap: 7px; } }
    </style>
</head>
<body><main class="shell"><header><a class="brand" href="/">SECURITY CONSOLE</a><a class="back" href="/">返回首页</a></header><section class="panel"><p class="eyebrow">Level 2 / Audit</p><h1>操作日志</h1><p class="lead">记录当前用户在系统中的关键操作，帮助团队保持工作过程可追踪。</p><div class="log"><div class="entry"><time>今天 10:24</time><strong>更新项目说明文档</strong><span class="status">已完成</span></div><div class="entry"><time>今天 09:48</time><strong>创建开发任务</strong><span class="status">已完成</span></div><div class="entry"><time>昨天 17:10</time><strong>加入协作项目</strong><span class="status">已完成</span></div></div></section></main></body>
</html>
