<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 1 · 文章中心</title>
    <style>
        /* Level 1 页面使用绿色强调色，表达基础访问区域。 */
        :root { --bg: #f3f7f4; --panel: #ffffff; --text: #17221b; --muted: #6b776e; --line: #dce7df; --accent: #23834b; --soft: #e7f5eb; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
        .shell { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 28px 0 48px; }
        header { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 28px; }
        .brand { color: var(--text); text-decoration: none; font-weight: 800; letter-spacing: .02em; }
        .back { color: var(--muted); text-decoration: none; font-size: 14px; }
        .back:hover { color: var(--accent); }
        .hero { display: grid; grid-template-columns: 1fr 280px; gap: 24px; align-items: stretch; margin-bottom: 22px; }
        .intro, .metric, .item { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
        .intro { padding: 34px; }
        .eyebrow { margin: 0 0 12px; color: var(--accent); font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
        h1 { margin: 0 0 12px; font-size: clamp(28px, 5vw, 42px); }
        .intro p { max-width: 620px; margin: 0; color: var(--muted); line-height: 1.8; }
        .metric { display: grid; place-content: center; padding: 24px; background: var(--soft); border-color: #c9e8d1; }
        .metric strong { font-size: 48px; line-height: 1; color: var(--accent); }
        .metric span { margin-top: 10px; color: var(--muted); }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
        .item { padding: 24px; }
        .item h2 { margin: 0 0 10px; font-size: 20px; }
        .item p { min-height: 52px; margin: 0 0 20px; color: var(--muted); line-height: 1.7; }
        .link { color: var(--accent); font-weight: 700; text-decoration: none; }
        .link:hover { text-decoration: underline; }
        @media (max-width: 760px) { .hero, .grid { grid-template-columns: 1fr; } .shell { width: min(100% - 28px, 560px); } .intro { padding: 26px; } }
    </style>
</head>
<body>
<main class="shell">
    <header><a class="brand" href="/">SECURITY CONSOLE</a><a class="back" href="/">返回首页</a></header>
    <section class="hero">
        <div class="intro"><p class="eyebrow">Access level 01</p><h1>文章中心</h1><p>面向基础用户开放的内容浏览区域。这里展示公开信息与日常工作入口，适合作为 Spring Security 的第一级权限示例。</p></div>
        <div class="metric"><strong>01</strong><span>基础访问级别</span></div>
    </section>
    <section class="grid" aria-label="文章中心功能">
        <article class="item"><h2>最新文章</h2><p>浏览近期发布的技术文章和学习笔记。</p><a class="link" href="/level1/1">进入文章列表 →</a></article>
        <article class="item"><h2>推荐内容</h2><p>查看系统根据主题整理的精选内容。</p><a class="link" href="/level1/2">查看推荐 →</a></article>
        <article class="item"><h2>阅读记录</h2><p>回顾最近打开过的页面与学习进度。</p><a class="link" href="/level1/3">查看记录 →</a></article>
    </section>
</main>
</body>
</html>
