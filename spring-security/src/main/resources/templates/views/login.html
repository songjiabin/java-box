</html><!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录页面</title>
    <style>
        /* 页面基础色彩，保持登录页简洁，方便后续学习替换。 */
        :root {
            --page-bg: #f4f7fb;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --brand: #2563eb;
            --brand-dark: #1d4ed8;
            --border: #dbe3ef;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: var(--page-bg);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
        }

        .login-card {
            width: min(100%, 400px);
            padding: 40px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 16px 40px rgba(31, 41, 55, 0.08);
        }

        h1 {
            margin: 0 0 8px;
            text-align: center;
            font-size: 28px;
        }

        .subtitle {
            margin: 0 0 28px;
            color: var(--text-muted);
            text-align: center;
            font-size: 14px;
        }

        .form-item {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            height: 44px;
            padding: 0 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            outline: none;
            font: inherit;
        }

        input:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        button {
            width: 100%;
            height: 44px;
            margin-top: 6px;
            border: 0;
            border-radius: 6px;
            background: var(--brand);
            color: #ffffff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: var(--brand-dark);
        }

        .message {
            min-height: 22px;
            margin: 16px 0 0;
            color: #dc2626;
            text-align: center;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>
<main class="login-card">
    <h1>登录</h1>
    <p class="subtitle">Spring Security 学习示例</p>

    <form action="/login" method="post">
        <div class="form-item">
            <label for="username">用户名</label>
            <input id="username" name="username" type="text" placeholder="请输入用户名" autocomplete="username" required>
        </div>

        <div class="form-item">
            <label for="password">密码</label>
            <input id="password" name="password" type="password" placeholder="请输入密码" autocomplete="current-password" required>
        </div>

        <button type="submit">登录</button>
        <p class="message" aria-live="polite"></p>
    </form>
</main>
</body>
</html>
