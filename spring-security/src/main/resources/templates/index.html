<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Security 示例</title>
    <style>
        /* 首页基础色彩，保持示例页面简单，便于后续继续学习路由和权限。 */
        :root {
            --page-bg: #f4f7fb;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --brand: #2563eb;
            --brand-dark: #1d4ed8;
            --border: #dbe3ef;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 34px 24px 56px;
            background: var(--page-bg);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
        }

        .home-card {
            width: min(1120px, 100%);
            margin: 0 auto;
            padding: 42px 48px 48px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 16px 40px rgba(31, 41, 55, 0.08);
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding-bottom: 28px;
            border-bottom: 1px solid var(--border);
        }

        .brand {
            color: var(--text-main);
            font-size: 14px;
            font-weight: 800;
            letter-spacing: .08em;
        }

        .status {
            padding: 8px 12px;
            border-radius: 6px;
            background: #eff6ff;
            color: var(--brand-dark);
            font-size: 13px;
            font-weight: 700;
        }

        .intro {
            max-width: 760px;
            padding: 44px 0 38px;
        }

        .eyebrow {
            margin: 0 0 12px;
            color: var(--brand);
            font-size: 13px;
            font-weight: 800;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 14px;
            font-size: clamp(36px, 5vw, 56px);
            line-height: 1.1;
        }

        .subtitle {
            max-width: 680px;
            margin: 0;
            color: var(--text-muted);
            font-size: 17px;
            line-height: 1.8;
        }

        .section-heading {
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 20px;
            margin-bottom: 16px;
        }

        .section-heading h2 {
            margin: 0;
            font-size: 22px;
        }

        .section-heading p {
            margin: 0;
            color: var(--text-muted);
            font-size: 14px;
        }

        .level-menu {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        /* 每个权限级别的导航块用于集中展示该级别下的三个页面入口。 */
        .level-group {
            min-height: 224px;
            padding: 24px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #fbfcfe;
        }

        .level-group:nth-child(1) { border-top: 4px solid #23834b; }
        .level-group:nth-child(2) { border-top: 4px solid var(--brand); }
        .level-group:nth-child(3) { border-top: 4px solid #b45309; }

        .level-group h3 {
            margin: 0 0 6px;
            font-size: 19px;
        }

        .level-group p {
            margin: 0 0 18px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .level-group a {
            display: block;
            padding: 10px 0;
            border-top: 1px solid var(--border);
            color: var(--brand-dark);
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
        }

        .level-group a:hover {
            color: var(--brand);
            text-decoration: underline;
        }

        .menu {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }

        .menu a {
            display: block;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: border-color 0.2s, background-color 0.2s, color 0.2s;
        }

        .menu a:hover {
            border-color: var(--brand);
            background: #eff6ff;
            color: var(--brand-dark);
        }

        @media (max-width: 820px) {
            .home-card {
                padding: 32px;
            }

            .level-menu {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 16px 12px 32px;
            }

            .home-card {
                padding: 24px 20px 28px;
            }

            .topbar,
            .section-heading {
                display: block;
            }

            .status {
                display: inline-block;
                margin-top: 14px;
            }

            .intro {
                padding: 34px 0;
            }
        }
    </style>
</head>
<body>
<main class="home-card">
    <header class="topbar">
        <span class="brand">SECURITY CONSOLE</span>
        <span class="status">Spring Security Demo</span>
    </header>

    <section class="intro">
        <p class="eyebrow">Access control workspace</p>
        <h1>Spring Security 示例</h1>
        <p class="subtitle">从基础内容到管理员控制台，集中查看当前示例项目中的权限页面和访问入口。</p>
    </section>

    <section aria-labelledby="level-title">
        <div class="section-heading">
            <h2 id="level-title">权限页面</h2>
            <p>共 3 个级别 · 9 个页面</p>
        </div>
        <nav class="level-menu" aria-label="权限页面入口">
            <section class="level-group">
                <h3>Level 1 · 基础访问</h3>
                <p>公开内容与个人阅读功能</p>
                <a href="/level1/1">文章中心</a>
                <a href="/level1/2">推荐内容</a>
                <a href="/level1/3">阅读记录</a>
            </section>
            <section class="level-group">
                <h3>Level 2 · 登录用户</h3>
                <p>业务数据与团队协作功能</p>
                <a href="/level2/1">数据概览</a>
                <a href="/level2/2">团队协作</a>
                <a href="/level2/3">操作日志</a>
            </section>
            <section class="level-group">
                <h3>Level 3 · 管理员</h3>
                <p>系统管理与安全审计功能</p>
                <a href="/level3/1">管理控制台</a>
                <a href="/level3/2">用户管理</a>
                <a href="/level3/3">安全审计</a>
            </section>
        </nav>
    </section>

    <nav class="menu" aria-label="功能入口">
        <a href="/tologin">登录</a>
        <a href="/user/add">增加用户</a>
        <a href="/user/delete">删除用户</a>
    </nav>
</main>
</body>
</html>
