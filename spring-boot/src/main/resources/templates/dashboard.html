<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>控制台</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/dashboard.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark dashboard-navbar">
    <a class="navbar-brand" th:href="@{/dashboard}">员工管理系统</a>
    <span class="navbar-text text-white">
        欢迎，<strong th:text="${session.loginUser}">用户</strong>
    </span>
</nav>

<div class="container-fluid">
    <div class="row">
        <aside class="col-md-3 col-lg-2 dashboard-sidebar">
            <div class="sidebar-title">系统菜单</div>
            <a class="sidebar-link active" th:href="@{/dashboard}">控制台</a>
            <a class="sidebar-link" th:href="@{/emps}">员工管理</a>
            <a class="sidebar-link" th:href="@{/test2}">模板测试</a>
            <a class="sidebar-link" th:href="@{/index.html}">退出登录</a>
        </aside>

        <main class="col-md-9 col-lg-10 dashboard-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="page-title">控制台</h1>
                    <p class="page-subtitle">欢迎进入员工管理系统</p>
                </div>
                <span class="badge badge-primary">Spring Boot</span>
            </div>

            <div class="row">
                <div class="col-md-6 col-xl-4 mb-4">
                    <section class="dashboard-card">
                        <div class="card-label">员工管理</div>
                        <h2>员工信息</h2>
                        <p>查看当前系统中的员工列表和基本信息。</p>
                        <a class="btn btn-primary" th:href="@{/emps}">查看员工</a>
                    </section>
                </div>
                <div class="col-md-6 col-xl-4 mb-4">
                    <section class="dashboard-card">
                        <div class="card-label">学习示例</div>
                        <h2>模板页面</h2>
                        <p>练习 Controller、Thymeleaf 和页面跳转。</p>
                        <a class="btn btn-outline-primary" th:href="@{/test2}">打开示例</a>
                    </section>
                </div>
                <div class="col-md-6 col-xl-4 mb-4">
                    <section class="dashboard-card dashboard-card-muted">
                        <div class="card-label">当前状态</div>
                        <h2>系统运行中</h2>
                        <p>当前用户已通过登录拦截器校验。</p>
                        <span class="status-dot">已登录</span>
                    </section>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
