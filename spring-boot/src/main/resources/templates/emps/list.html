<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>员工列表</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/dashboard.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark dashboard-navbar">
    <a class="navbar-brand" th:href="@{/dashboard}">员工管理系统</a>
    <span class="navbar-text text-white">欢迎，<strong th:text="${session.loginUser}">用户</strong></span>
</nav>

<div class="container-fluid">
    <div class="row">
        <!-- 复用公共侧边栏，并将员工列表菜单设置为高亮。 -->
        <div th:replace="~{commons/commons :: sidebar(active='list.html')}"></div>

        <main role="main" class="col-md-9 ml-sm-auto col-lg-10 dashboard-content">
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
                <h2 class="page-title">员工列表</h2>
                <div>
                    <!-- 新增员工入口：跳转到员工新增页面。 -->
                    <a class="btn btn-success mr-2" th:href="@{/emp}">添加员工</a>
                    <a class="btn btn-primary" th:href="@{/dashboard}">返回控制台</a>
                </div>
            </div>

            <div class="table-responsive bg-white border rounded">
                <table class="table table-striped table-hover table-sm mb-0">
                    <thead class="thead-light">
                    <tr>
                        <th scope="col">编号</th>
                        <th scope="col">姓名</th>
                        <th scope="col">邮箱</th>
                        <th scope="col">性别</th>
                        <th scope="col">部门</th>
                        <th scope="col">出生日期</th>
                        <th scope="col">操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="emp : ${emps}">
                        <td th:text="${emp.id}">1001</td>
                        <td th:text="${emp.lastName}">AA</td>
                        <td th:text="${emp.email}">aa@example.com</td>
                        <td th:text="${emp.gender == 0 ? '女' : '男'}">男</td>
                        <td th:text="${emp.department.departmentName}">教学部</td>
                        <td th:text="${#dates.format(emp.birth, 'yyyy-MM-dd HH:mm:ss')}">2026-09-04</td>
                        <td>
                            <a class="btn btn-sm btn-primary" th:href="@{/emp/{id}(id=${emp.id})}">编辑</a>
                            <a class="btn btn-sm btn-danger" th:href="@{/emp/delete/{id}(id=${emp.id})}">删除</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(emps)}">
                        <td class="text-center text-muted" colspan="7">暂无员工数据</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>
</body>
</html>
